{% extends "base.html" %}
{% block title %}Comps calculator{% endblock %}
{% block content %}
<form method="POST">
    <input type="text" name="ticker" placeholder="e.g AAPL">
    <input type="submit" value="Fetch Data">
</form>
    <form method="POST">
        <div id="companies-container">
            <div class="company-row">
            Share Price: <input type="text" name="share_price_1" value="{{ fetched_data.share_price if fetched_data else '' }}">
            EPS: <input type="text" name="eps_1" value="{{ fetched_data.eps if fetched_data else '' }}">
            Shares: <input type="text" name="shares_outstanding_1" value="{{ fetched_data.shares_outstanding if fetched_data else '' }}">
            Total Debt: <input type="text" name="total_debt_1" value="{{ fetched_data.total_debt if fetched_data else '' }}">
            Cash and Cash Equivalents: <input type="text" name="cash_and_cash_equivalents_1" value="{{ fetched_data.cash_and_cash_equivalents if fetched_data else '' }}">
            EBIT: <input type="text" name="ebit_1" value="{{ fetched_data.ebit if fetched_data else '' }}">
            D and A: <input type="text" name="d_and_a_1" value="{{ fetched_data.d_and_a if fetched_data else '' }}">
            </div>
            </div>
            <button type="button" id="add-company">+ Add Company</button>
            Sort By<select name="sort_by">
                <option value="pe_ratio">P/E Ratio </option>
                <option value="ev_ebitda_ratio">EV/EBITDA Ratio</option>
            </select>
            Filter By<select name="filter_by">
                <option value="pe_ratio">P/E Ratio </option>
                <option value="ev_ebitda_ratio">EV/EBITDA Ratio</option>
            </select>
            Cut Off <input type ="text" name="cut_off">
            <input type="submit" value="Submit">
            <input type="hidden" id="company-count-input" name="company_count" value="1">
            </form>
            <script>
                let companyCount = 1;
                document.getElementById('add-company').addEventListener('click', function() {
                    companyCount ++
                    document.getElementById('company-count-input').value = companyCount;
                    const container = document.getElementById('companies-container');
                    const NewRow = document.createElement('div');
                    NewRow.className = "company-row";
                    NewRow.innerHTML = `
                    Share Price: <input type="text" name="share_price_${companyCount}">
                    EPS: <input type="text" name="eps_${companyCount}">
                    Shares: <input type="text" name="shares_outstanding_${companyCount}">
                    Total Debt: <input type="text" name="total_debt_${companyCount}">
                    Cash and Cash Equivalents: <input type="text" name="cash_and_cash_equivalents_${companyCount}">
                    EBIT: <input type="text" name="ebit_${companyCount}">
                    D and A: <input type="text" name="d_and_a_${companyCount}">
                    `;
                    container.appendChild(NewRow);

                });
                 </script>
 {% endblock content %}
